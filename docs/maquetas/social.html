<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#10140f">
    <title>Maqueta · hub social</title>
    <!-- MAQUETA DEL HUB SOCIAL, para verlo SIN SESIÓN. Monta las pantallas REALES del hub (los mismos componentes,
         con el mismo marco `main.main-social`) con datos inventados y sin red: ni Firebase, ni GitHub, ni carátulas.
         No entra en el build; la sirve el servidor de desarrollo en `/docs/maquetas/social.html`, y TypeScript la
         comprueba con el resto (`tsconfig.json` incluye `docs/maquetas`): si un componente cambia de props, la
         maqueta deja de compilar en vez de quedarse vieja en silencio.

         Una barra flotante (abajo a la derecha) cambia de pantalla, vista, tema y modo. Parámetros:
           ?pantalla=feed|feed-vacio|amigos|solicitudes|perfil|perfil-propio|ajustes|logros|globales|resena|resena-perfil
           &vista=resenas|publicaciones   (perfil y perfil-propio: las sub-rutas de la ficha)
           &abrir=estadisticas|resumen    (perfil y perfil-propio: el panel de estadísticas o el resumen del año)
           &gl-palette=<id>               (tierramedia, arcade, witcher, persona, portal, cyberpunk, seaofstars, grimdark)
           &gl-theme=dark|light           (por defecto, dark)
           &gl-effects=off                (apaga los efectos animados de los temas; la app los trae encendidos)
           &barra=0                       (sin la barra, para capturas)
         Para fotografiarla entera en todos los temas: `node scripts/capturar-maqueta-social.mjs` (ver su cabecera).
         La PUERTA del social (sin sesión) no está aquí: se ve en la app de verdad, en `/social`.

         El bloque de abajo hace lo mismo que el anti-flash de `index.html`, pero leyendo la URL en vez de
         `localStorage`, y sin escribir nada: la maqueta no toca las preferencias guardadas. -->
    <script>(function () {
  var BG = {
    tierramedia: { dark: '#10140f', light: '#ece3cc' },
    witcher: { dark: '#141922', light: '#d8e0e7' },
    persona: { dark: '#0d0d0d', light: '#f4f1ee' },
    portal: { dark: '#12171b', light: '#e7dabd' },
    cyberpunk: { dark: '#08090d', light: '#e7eaee' },
    grimdark: { dark: '#060b08', light: '#e7ddc3' },
    seaofstars: { dark: '#0e0c24', light: '#a6e9ec' },
    arcade: { dark: '#150a24', light: '#eee2fb' }
  };
  var params = new URLSearchParams(window.location.search);
  var root = document.documentElement;
  var theme = params.get('gl-theme') === 'light' ? 'light' : 'dark';
  if (theme === 'light') {
    root.setAttribute('data-theme', 'light');
  }
  var palette = params.get('gl-palette');
  if (palette === 'steam') {
    palette = 'witcher';
  }
  if (!BG[palette]) {
    palette = 'tierramedia';
  }
  root.setAttribute('data-palette', palette);
  // Lo que la app deja escrito al montar sus preferencias con los valores de fábrica (efectos encendidos, listado
  // en renglones, cuadros medianos): hay CSS que cuelga de estos atributos.
  if (params.get('gl-effects') !== 'off') {
    root.setAttribute('data-effects', 'on');
  }
  root.setAttribute('data-list-shape', 'list');
  root.setAttribute('data-grid-size', 'md');
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) {
    meta.setAttribute('content', BG[palette][theme]);
  }
})();</script>
    <script type="module" src="/docs/maquetas/social.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
