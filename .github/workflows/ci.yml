name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  release:
    types: [ published ]

env:
  # Node 20 salió de soporte en abril de 2026: el CI corría sobre un runtime sin parches de seguridad. La 22 es
  # además el mínimo que exige html-validate 11 (`engines`), así que las dos cosas se mueven a la vez.
  NODE_VERSION: '22'

jobs:
  test-and-validate:
    name: Test, Validate, Coverage & Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Set up Java (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        
      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm run test -- --reporter=verbose

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Run Firestore rules tests (emulator)
        run: npm run test:rules

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run e2e smoke test (production build)
        run: npm run test:e2e

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: coverage
          fail_ci_if_error: false
          verbose: true
        continue-on-error: true

      - name: Run validation (ESLint + html-validate)
        run: npm run validate

      - name: Privacy audit (no private data in public channels)
        run: npm run audit:privacy

      - name: Security audit
        run: npm audit --audit-level=moderate
        continue-on-error: true
