<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1e24">
    <!-- F1: aplica el tema/paleta guardados ANTES del primer render (evita el flash). Inline para
         ahorrar una petición bloqueante en la ruta crítica. Al no ser 'self' externo, la CSP lo
         admite por hash SHA-256: si tocas este bloque, recalcula el hash en `public/_headers`
         (script-src 'sha256-...'). Mantén claves/colores en sincronía con storageKeys/palettes/_base.scss. -->
    <script>(function () {
  var BG = {
    steam: { dark: '#1a1e24', light: '#f0e9db' },
    persona: { dark: '#0d0d0d', light: '#f4f1ee' },
    portal: { dark: '#12171b', light: '#e7ecf0' },
    cyberpunk: { dark: '#08090d', light: '#e7eaee' },
    grimdark: { dark: '#060b08', light: '#e4e2d4' },
    seaofstars: { dark: '#0e0c24', light: '#a6e9ec' }
  };
  try {
    var pref = localStorage.getItem('mis-listas-theme');
    var theme = pref === 'light' ? 'light'
      : pref === 'dark' ? 'dark'
        : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    if (theme === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
    }
    var palette = localStorage.getItem('mis-listas-palette');
    if (!BG[palette]) {
      palette = 'steam';
    }
    if (palette !== 'steam') {
      document.documentElement.setAttribute('data-palette', palette);
    }
    if (localStorage.getItem('mis-listas-uppercase') === 'on') {
      document.documentElement.setAttribute('data-uppercase', 'on');
    }
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) {
      meta.setAttribute('content', BG[palette][theme]);
    }
  } catch (e) {}
})();</script>
    <meta name="description" content="Organiza, puntúa y sincroniza tu colección de videojuegos.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="My Game List">
    <meta property="og:title" content="My Game List">
    <meta property="og:description" content="Organiza, puntúa y sincroniza tu colección de videojuegos.">
    <!-- La tarjeta es JPEG, no SVG: X, WhatsApp, Facebook y LinkedIn no renderizan SVG en og:image (aceptan
         PNG, JPEG, WebP y GIF), así que la previsualización salía vacía en todas ellas. El .jpg lo genera
         `scripts/build-share-card.mjs` a partir de `public/share-card.svg`, que sigue siendo la fuente editable. -->
    <meta property="og:image" content="/share-card.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="My Game List — organiza, puntúa y sincroniza tu colección de videojuegos">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="My Game List">
    <meta name="twitter:description" content="Organiza, puntúa y sincroniza tu colección de videojuegos.">
    <meta name="twitter:image" content="/share-card.jpg">
    <meta name="twitter:image:alt" content="My Game List — organiza, puntúa y sincroniza tu colección de videojuegos">
    <title>Mis Listas de juegos</title>
    <!-- Iconos como archivos reales (no data: URI): así Firefox y Chromium los usan de forma
         fiable en pestaña, marcadores, historial y página de inicio, en escritorio y móvil.
         El .ico va primero: superficies como la barra de favoritos y los accesos directos
         piden /favicon.ico de forma implícita; sin él, Chromium/Edge muestran la letra del título. -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="32x32">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=2">
    <link rel="apple-touch-icon" href="/icon-192.png?v=2">
    <link rel="manifest" href="/manifest.json">
    <!-- Las fuentes se sirven desde el propio origen (`public/fonts/`, generado por scripts/vendor-fonts.mjs) y
         se declaran en el CSS de la app, así que aquí no hay nada que enlazar. Antes había dos `preconnect` y una
         hoja BLOQUEANTE de Google Fonts: dos saltos de red a dos dominios de terceros (DNS + TLS cada uno) antes
         de poder pedir siquiera el .woff2, y la IP del visitante enviada a Google en cada carga.
         DM Sans (base de todas las paletas) entra por `src/styles/index.scss`; las fuentes propias de cada paleta,
         por su skin, que se carga bajo demanda (ver src/view/hooks/paletteSkin.ts). -->
    <link rel="preload" href="/fonts/dm-sans-latin-468d56b6.woff2" as="font" type="font/woff2" crossorigin>
  </head>
  <body>
    <div id="root"></div>
    <!-- A11y-4: sin JavaScript, `#root` se queda vacío y la página era un rectángulo en blanco sin explicación
         (ni un error, ni una pista). Esto al menos dice qué pasa. La app es un SPA: no hay versión sin JS. -->
    <noscript>
      <div class="noscript-notice">
        <h1>Necesitas JavaScript</h1>
        <p>Mis Listas de juegos es una aplicación que se ejecuta en el navegador, así que necesita JavaScript
        activado. Actívalo y vuelve a cargar la página.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
